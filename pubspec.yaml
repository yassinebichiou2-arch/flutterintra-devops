name: devmob
description: "FlutterIntra - Enterprise Social Network"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # State management
  provider: ^6.1.2

  # Image & file picking
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  http: ^1.2.2

  # UI helpers
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  uuid: ^4.5.1
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Notifications
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

